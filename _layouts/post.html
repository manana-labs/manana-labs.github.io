<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Manana Labs</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/syntax.css">
  <style>
    .container {
      max-width: 940px;
    }
    @media (max-width: 960px) {
      .container { padding: 0 1rem; }
    }
    @media (max-width: 600px) {
      .post-title { font-size: 1.3rem; }
      .highlight { padding: 0.75rem; }
      .post-body table { font-size: 0.85rem; display: block; overflow-x: auto; }
    }
    .post-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #162a31;
      text-transform: none;
      letter-spacing: normal;
      margin-bottom: 0.4rem;
    }
    .post-meta {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }
    .post-body h2,
    .post-body h3 {
      text-transform: none;
      letter-spacing: normal;
    }
    .post-body h2 {
      font-size: 1.15rem;
      margin-top: 1.5rem;
    }
    .post-body h3 {
      font-size: 1rem;
      margin-top: 1.25rem;
    }
    .post-body img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .post-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    .post-body th, .post-body td {
      border: 1px solid #E0E0E0;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    .post-body th {
      background: #f5f5f5;
      font-weight: 600;
    }

    /* Code block layout */
    .highlight { border-radius: 8px; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
    .highlight pre { margin: 0; }
    .highlight code { font-size: 0.88rem; line-height: 1.5; }
    .post-body code { background: #f0f0f0; padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.88rem; }
    .post-body pre code { background: none; padding: 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="/" style="color:#162a31; text-decoration:none;">Manana Labs</a></h1>
      <p><a href="/blogs/" style="color:#555; text-decoration:none;">Blog</a></p>
    </header>

    <nav>
      <a href="/blogs/">← All posts</a>
    </nav>

    <section>
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} &bull; {{ page.author }}{% endif %}</p>
      <div class="post-body">
        {{ content }}
      </div>
    </section>

    <footer>
      &copy; {{ site.time | date: "%Y" }} Manana Labs
    </footer>
  </div>
</body>
</html>
