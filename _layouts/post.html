<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Manana Labs</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css">
  <style>
    .post-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #162a31;
      text-transform: none;
      letter-spacing: normal;
      margin-bottom: 0.4rem;
    }
    .post-meta {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }
    .post-body h2,
    .post-body h3 {
      text-transform: none;
      letter-spacing: normal;
    }
    .post-body h2 {
      font-size: 1.15rem;
      margin-top: 1.5rem;
    }
    .post-body h3 {
      font-size: 1rem;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="/" style="color:#162a31; text-decoration:none;">Manana Labs</a></h1>
      <p><a href="/blogs/" style="color:#555; text-decoration:none;">Blog</a></p>
    </header>

    <nav>
      <a href="/blogs/">← All posts</a>
    </nav>

    <section>
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} &bull; {{ page.author }}{% endif %}</p>
      <div class="post-body">
        {{ content }}
      </div>
    </section>

    <footer>
      &copy; {{ site.time | date: "%Y" }} Manana Labs
    </footer>
  </div>
</body>
</html>
